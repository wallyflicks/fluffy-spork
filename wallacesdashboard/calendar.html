<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0b">
  <title>Calendar — Wallace's Dashboard</title>
  <link rel="manifest" href="/manifest.json">
  <script src="/notifications.js" defer></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a0a0b;
      color: #FAFAFA;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .page-header {
      display: flex;
      align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ── iframe ── */
    .cal-wrap {
      flex: 1;
      min-height: 0;
      padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px));
    }

    .cal-wrap iframe {
      display: block;
    }

    /* ── Tabbar ── */
    .tabbar {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 999;
      display: flex;
      justify-content: center;
      padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
      background: rgba(10,10,11,0.95);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .tabbar-inner {
      width: 100%;
      max-width: 520px;
      display: flex;
      align-items: center;
      padding: 5px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      gap: 3px;
    }

    .tabbar-link {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      color: rgba(255,255,255,0.38);
      text-decoration: none;
      border-radius: 999px;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .tabbar-link svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .tabbar-link.active { background: #ffffff; color: #0a0a0a; }
  </style>
</head>
<body>

<div class="page-header">
  <span class="page-title">Calendar</span>
</div>

<div class="cal-wrap">
  <iframe
    src="https://calendar.google.com/calendar/embed?src=wallacechenga%40gmail.com&ctz=America%2FVancouver&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&mode=AGENDA"
    style="border: 0; width: 100%; height: 100%; filter: invert(1) hue-rotate(180deg);"
    allowfullscreen>
  </iframe>
</div>

<nav class="tabbar">
  <div class="tabbar-inner">
    <a href="index.html" class="tabbar-link">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <a href="health.html" class="tabbar-link">
      <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
    </a>
    <a href="gym.html" class="tabbar-link">
      <svg viewBox="0 0 24 24"><path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>
    </a>
    <a href="finance.html" class="tabbar-link">
      <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
    </a>
    <a href="journal.html" class="tabbar-link">
      <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
    </a>
    <a href="content.html" class="tabbar-link">
      <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    </a>
    <a href="calendar.html" class="tabbar-link active">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    </a>
    <a href="news.html" class="tabbar-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2z"/><path d="M4 22a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8z"/></svg>
    </a>
  </div>
</nav>

</body>
</html>
