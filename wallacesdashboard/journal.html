<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0b">
<title>Journal — Dashboard</title>
<link rel="manifest" href="/manifest.json">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
:root {
  --bg: #0a0a0b;
  --bg-card: #111113;
  --text-1: #ffffff;
  --text-2: rgba(255,255,255,0.6);
  --text-3: rgba(255,255,255,0.4);
  --text-4: rgba(255,255,255,0.25);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.14);
  --good: #6ee7b7;
  --warn: #fbbf24;
  --bad: #ff8a8a;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100%;
  overflow-x: hidden;
}
body {
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(110px + env(safe-area-inset-bottom, 0px));
  max-width: 720px;
  margin: 0 auto;
}

/* Header */
.page-header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 20px;
}
.page-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.015em;
}
.page-date {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--text-3);
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Section label */
.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 20px 0 10px;
}

/* Card */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 12px;
}

/* Entry header in read mode */
.entry-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.rating-badge {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  flex-shrink: 0;
  background: rgba(255,255,255,0.08);
  color: var(--text-3);
}
.rating-badge.red    { background: rgba(255,138,138,0.2); color: var(--bad); }
.rating-badge.yellow { background: rgba(251,191,36,0.2);  color: var(--warn); }
.rating-badge.green  { background: rgba(110,231,183,0.2); color: var(--good); }
.entry-date-label {
  flex: 1;
  font-size: 14px; font-weight: 600; color: var(--text-2);
}

/* Entry field */
.entry-field {
  margin-bottom: 16px;
}
.entry-field:last-child { margin-bottom: 0; }
.entry-field-label {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 8px;
}
.field-icon {
  font-size: 12px;
  font-style: normal;
  font-weight: 800;
  color: var(--text-2);
  font-family: var(--font-mono);
  letter-spacing: 0;
}
textarea {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text-1);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  padding: 12px 14px;
  outline: none;
  resize: none;
  -webkit-appearance: none;
  transition: border-color 0.15s;
}
textarea:focus { border-color: rgba(255,255,255,0.22); }
textarea::placeholder { color: var(--text-4); }

/* Rating selector */
.rating-selector {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 4px;
}
.rating-btn {
  aspect-ratio: 1;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  color: var(--text-3);
  font-size: 12px;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.12s;
}
.rating-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-1); }
.rating-btn.sel-red    { background: rgba(255,138,138,0.2); border-color: rgba(255,138,138,0.45); color: var(--bad); }
.rating-btn.sel-yellow { background: rgba(251,191,36,0.2);  border-color: rgba(251,191,36,0.45);  color: var(--warn); }
.rating-btn.sel-green  { background: rgba(110,231,183,0.2); border-color: rgba(110,231,183,0.45); color: var(--good); }

/* Read mode fields */
.entry-read-field { margin-bottom: 14px; }
.entry-read-field:last-child { margin-bottom: 0; }
.entry-read-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--text-3);
  margin-bottom: 5px;
}
.entry-read-value {
  font-size: 15px; line-height: 1.6; color: var(--text-1);
  white-space: pre-wrap;
}
.entry-read-value.empty { color: var(--text-4); font-style: italic; }

/* Photos in form */
.photo-row {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.photo-slot {
  width: 80px; height: 80px;
  border-radius: 12px;
  border: 1px dashed var(--border-strong);
  background: rgba(255,255,255,0.02);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-4); font-size: 24px;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
  position: relative; overflow: hidden;
}
.photo-slot:hover { background: rgba(255,255,255,0.05); color: var(--text-2); }
.photo-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-slot .rm-photo {
  position: absolute; top: 3px; right: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(0,0,0,0.72); color: #fff;
  font-size: 13px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 2;
  -webkit-tap-highlight-color: transparent;
}

/* Photos in read mode */
.entry-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.entry-photos img {
  width: 72px; height: 72px; border-radius: 10px;
  object-fit: cover; border: 1px solid var(--border);
  cursor: pointer;
}

/* Buttons */
.btn-primary {
  flex: 1; padding: 14px;
  border: none;
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b;
  border-radius: 12px;
  font-family: var(--font);
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 14px rgba(0,0,0,0.40);
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s;
}
.btn-primary:active { transform: scale(0.98); }
.btn-secondary {
  padding: 11px 18px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text-1);
  border-radius: 10px;
  font-family: var(--font);
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-secondary:hover { background: rgba(255,255,255,0.08); }
.btn-row { display: flex; gap: 8px; margin-top: 18px; }

/* Past entry cards */
.entry-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 8px;
  overflow: hidden;
}
.entry-card-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.entry-card-header:hover { background: rgba(255,255,255,0.02); }
.rating-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.rating-dot.red    { background: var(--bad); }
.rating-dot.yellow { background: var(--warn); }
.rating-dot.green  { background: var(--good); }
.rating-dot.none   { background: var(--text-4); }
.entry-card-date {
  font-size: 13px; font-weight: 600; color: var(--text-1);
  min-width: 96px; flex-shrink: 0;
}
.entry-card-preview {
  flex: 1; font-size: 12px; color: var(--text-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.entry-card-chevron {
  color: var(--text-4);
  transition: transform 0.2s; flex-shrink: 0;
  display: flex; align-items: center;
}
.entry-card-chevron svg { width: 16px; height: 16px; }
.entry-card.expanded .entry-card-chevron { transform: rotate(180deg); }
.entry-card-body {
  display: none;
  padding: 2px 16px 16px;
  border-top: 1px solid var(--border);
}
.entry-card.expanded .entry-card-body { display: block; }
.entry-card-body .entry-read-field { margin-top: 14px; }

/* Load more */
.load-more-btn {
  width: 100%; padding: 12px;
  border: 1px solid var(--border);
  background: transparent; color: var(--text-3);
  border-radius: 12px; font-family: var(--font);
  font-size: 13px; font-weight: 600;
  cursor: pointer; margin-top: 4px;
  -webkit-tap-highlight-color: transparent;
}
.load-more-btn:hover { background: rgba(255,255,255,0.04); color: var(--text-2); }

/* Trend graph */
.trend-svg { width: 100%; display: block; overflow: visible; }
.trend-axis-labels {
  display: flex; justify-content: space-between;
  margin-top: 6px;
  font-size: 9px; font-family: var(--font-mono);
  color: var(--text-4);
}

/* Toast */
.save-toast {
  position: fixed; bottom: 120px; left: 50%;
  transform: translateX(-50%) translateY(14px);
  background: rgba(110,231,183,0.12);
  border: 1px solid rgba(110,231,183,0.3);
  color: var(--good);
  padding: 9px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 600;
  pointer-events: none; opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  z-index: 500; white-space: nowrap;
}
.save-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Lightbox */
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.88); z-index: 10000;
  align-items: center; justify-content: center; padding: 20px;
}
.lightbox.show { display: flex; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; object-fit: contain; }

/* Tabbar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  display: flex; justify-content: center;
  padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
  background: rgba(10,10,11,0.95);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid rgba(255,255,255,0.06);
}
.tabbar-inner {
  width: 100%; max-width: 480px;
  display: flex; align-items: center;
  padding: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px; gap: 4px;
}
.tabbar-link {
  flex: 1; display: flex; align-items: center; justify-content: center;
  height: 44px; min-width: 0;
  color: rgba(255,255,255,0.38);
  text-decoration: none; border-radius: 999px;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.tabbar-link svg {
  width: 20px; height: 20px;
  stroke: currentColor; fill: none;
  stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.tabbar-link.active { background: #ffffff; color: #0a0a0a; }
.tabbar-link:hover:not(.active) { color: rgba(255,255,255,0.65); }

@media (max-width: 380px) {
  .rating-selector { gap: 3px; }
  .rating-btn { font-size: 11px; border-radius: 6px; }
}
</style>
</head>
<body>

<div class="save-toast" id="saveToast">Saved</div>

<div class="page-header">
  <h1 class="page-title">Journal</h1>
  <span class="page-date" id="todayLabel"></span>
</div>

<div class="section-label">TODAY</div>
<div id="journalLoading" style="display:none;text-align:center;color:rgba(255,255,255,0.3);font-size:13px;padding:28px 0;font-style:italic">Loading…</div>

<!-- Read mode -->
<div class="card" id="readCard" style="display:none">
  <div class="entry-header">
    <div class="rating-badge" id="readBadge">—</div>
    <div class="entry-date-label" id="readDateLabel">—</div>
    <button class="btn-secondary" id="editBtn">Edit</button>
  </div>
  <div class="entry-read-field">
    <div class="entry-read-label">W — Wins</div>
    <div class="entry-read-value" id="readWins"></div>
  </div>
  <div class="entry-read-field">
    <div class="entry-read-label">L — Losses</div>
    <div class="entry-read-value" id="readLosses"></div>
  </div>
  <div class="entry-read-field">
    <div class="entry-read-label">→ Tomorrow's Focus</div>
    <div class="entry-read-value" id="readTomorrow"></div>
  </div>
  <div class="entry-read-field" id="readPhotosField" style="display:none">
    <div class="entry-read-label">Photos</div>
    <div class="entry-photos" id="readPhotos"></div>
  </div>
</div>

<!-- Form mode -->
<div class="card" id="formCard">
  <div class="entry-field">
    <div class="entry-field-label"><span class="field-icon">W</span>Wins — what went well</div>
    <textarea id="fWins" rows="3" placeholder="What went well today?"></textarea>
  </div>
  <div class="entry-field">
    <div class="entry-field-label"><span class="field-icon">L</span>Losses — what you'd do differently</div>
    <textarea id="fLosses" rows="3" placeholder="What didn't work? What would you change?"></textarea>
  </div>
  <div class="entry-field">
    <div class="entry-field-label"><span class="field-icon">→</span>Tomorrow's focus</div>
    <textarea id="fTomorrow" rows="2" placeholder="One thing to focus on tomorrow"></textarea>
  </div>
  <div class="entry-field">
    <div class="entry-field-label">Day rating</div>
    <div class="rating-selector" id="ratingSelector"></div>
  </div>
  <div class="entry-field">
    <div class="entry-field-label">Photos (up to 3)</div>
    <div class="photo-row" id="photoRow"></div>
    <input type="file" id="photoInput" accept="image/*" multiple style="display:none">
  </div>
  <div class="btn-row">
    <button class="btn-secondary" id="cancelBtn" style="display:none">Cancel</button>
    <button class="btn-primary" id="saveBtn">Save entry</button>
  </div>
</div>

<!-- Past entries -->
<div class="section-label">PAST ENTRIES</div>
<div id="pastList"></div>
<button class="load-more-btn" id="loadMoreBtn" style="display:none">Load more</button>

<!-- 30-day trend -->
<div class="section-label">30-DAY TREND</div>
<div class="card" style="padding: 16px 16px 12px">
  <svg class="trend-svg" id="trendSvg" viewBox="0 0 320 90" style="height:110px"></svg>
  <div class="trend-axis-labels" id="trendLabels"></div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<nav class="tabbar" aria-label="Bottom navigation">
  <div class="tabbar-inner">
    <a href="index.html"    class="tabbar-link" aria-label="Main"><i data-lucide="home"></i></a>
    <a href="health.html"   class="tabbar-link" aria-label="Health"><i data-lucide="heart"></i></a>
    <a href="gym.html"      class="tabbar-link" aria-label="Gym"><i data-lucide="dumbbell"></i></a>
    <a href="finance.html"  class="tabbar-link" aria-label="Finance"><i data-lucide="dollar-sign"></i></a>
    <a href="sleep.html"    class="tabbar-link" aria-label="Sleep"><i data-lucide="moon"></i></a>
    <a href="deepwork.html" class="tabbar-link" aria-label="Deep Work"><i data-lucide="brain"></i></a>
    <a href="journal.html"  class="tabbar-link active" aria-current="page" aria-label="Journal"><i data-lucide="book-open"></i></a>
  </div>
</nav>
<script>if(window.lucide)lucide.createIcons();</script>

<script>
(function () {
  'use strict';

  const SUPA_URL = 'https://qznrmfrqbbkkbvvrxteu.supabase.co';
  const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF6bnJtZnJxYmJra2J2dnJ4dGV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTUxMjIsImV4cCI6MjA5NDI5MTEyMn0.VPma99T8m9WqvGk4xArAwtXsAXuz6LgQps27LEefyd0';
  const SB_HDR = {
    'Content-Type': 'application/json',
    'apikey': SUPA_KEY,
    'Authorization': 'Bearer ' + SUPA_KEY,
    'Prefer': 'resolution=merge-duplicates',
  };
  const LS_KEY = 'wallace_journal';

  // ── Date helpers ─────────────────────────────────────────────────
  function todayVan() {
    return new Date().toLocaleDateString('en-CA', { timeZone: 'America/Vancouver' });
  }
  function fmtDisplay(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric'
    });
  }
  function ratingClass(r) {
    if (!r) return 'none';
    if (r <= 4) return 'red';
    if (r <= 7) return 'yellow';
    return 'green';
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ── LocalStorage ─────────────────────────────────────────────────
  function getAll() {
    try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
  }
  function setAll(data) { localStorage.setItem(LS_KEY, JSON.stringify(data)); }
  function getEntry(date) { return getAll()[date] || null; }
  function putEntry(entry) { const a = getAll(); a[entry.date] = entry; setAll(a); }

  // ── Supabase ─────────────────────────────────────────────────────
  async function sbUpsert(entry) {
    try {
      const res = await fetch(SUPA_URL + '/rest/v1/journal_entries?on_conflict=date', {
        method: 'POST',
        headers: SB_HDR,
        body: JSON.stringify({
          date: entry.date,
          wins: entry.wins || '',
          losses: entry.losses || '',
          tomorrow: entry.tomorrow || '',
          rating: entry.rating || null,
          photos: entry.photos || [],
          updated_at: new Date().toISOString(),
        }),
      });
      if (res.ok) {
        console.log('JOURNAL SAVED TO SUPABASE:', entry.date, 'OK');
        return true;
      } else {
        const detail = await res.text();
        console.warn('JOURNAL SAVED TO SUPABASE: failed', res.status, detail);
        return false;
      }
    } catch (e) {
      console.warn('JOURNAL SAVED TO SUPABASE: error', e.message);
      return false;
    }
  }

  async function sbFetchAll() {
    try {
      const res = await fetch(
        SUPA_URL + '/rest/v1/journal_entries?select=*&order=date.desc',
        { headers: { 'apikey': SUPA_KEY, 'Authorization': 'Bearer ' + SUPA_KEY } }
      );
      if (!res.ok) {
        const detail = await res.text();
        console.warn('JOURNAL LOADED FROM SUPABASE: failed', res.status, detail);
        return null;
      }
      const data = await res.json();
      console.log('JOURNAL LOADED FROM SUPABASE:', data.length, 'entries', data);
      return data;
    } catch (e) {
      console.warn('JOURNAL LOADED FROM SUPABASE: error', e.message);
      return null;
    }
  }

  // ── State ────────────────────────────────────────────────────────
  const TODAY = todayVan();
  let selectedRating = null;
  let photos = [];
  let isEditMode = false;
  let pastOffset = 7;
  const BATCH = 7;

  // ── Boot ─────────────────────────────────────────────────────────
  document.getElementById('todayLabel').textContent = fmtDisplay(TODAY).toUpperCase();
  buildRatingSelector();
  buildPhotoUI();
  wireButtons();
  init();

  // ── Rating selector ──────────────────────────────────────────────
  function buildRatingSelector() {
    const sel = document.getElementById('ratingSelector');
    for (let i = 1; i <= 10; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'rating-btn';
      btn.textContent = i;
      btn.dataset.r = i;
      btn.addEventListener('click', () => setRating(i));
      sel.appendChild(btn);
    }
  }
  function setRating(r) {
    selectedRating = r;
    const cls = 'sel-' + ratingClass(r);
    document.querySelectorAll('.rating-btn').forEach(b => {
      b.classList.remove('sel-red', 'sel-yellow', 'sel-green');
      if (parseInt(b.dataset.r) === r) b.classList.add(cls);
    });
  }
  function clearRating() {
    selectedRating = null;
    document.querySelectorAll('.rating-btn').forEach(b =>
      b.classList.remove('sel-red', 'sel-yellow', 'sel-green'));
  }

  // ── Photo UI ─────────────────────────────────────────────────────
  function buildPhotoUI() {
    renderPhotoSlots();
    document.getElementById('photoInput').addEventListener('change', onPhotoInput);
    document.getElementById('photoRow').addEventListener('click', e => {
      const rm = e.target.closest('.rm-photo');
      if (rm) { photos.splice(parseInt(rm.dataset.i), 1); renderPhotoSlots(); }
    });
  }
  function renderPhotoSlots() {
    const row = document.getElementById('photoRow');
    row.innerHTML = '';
    photos.forEach((b64, i) => {
      const slot = document.createElement('div');
      slot.className = 'photo-slot';
      const img = document.createElement('img');
      img.src = b64; img.alt = 'Photo ' + (i + 1);
      const rm = document.createElement('span');
      rm.className = 'rm-photo'; rm.dataset.i = i; rm.textContent = '×';
      slot.appendChild(img); slot.appendChild(rm);
      row.appendChild(slot);
    });
    if (photos.length < 3) {
      const add = document.createElement('div');
      add.className = 'photo-slot';
      add.innerHTML = '+';
      add.addEventListener('click', () => document.getElementById('photoInput').click());
      row.appendChild(add);
    }
  }
  function onPhotoInput(e) {
    const files = Array.from(e.target.files).slice(0, 3 - photos.length);
    let loaded = 0;
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        photos.push(ev.target.result);
        if (++loaded === files.length) renderPhotoSlots();
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  // ── Button wiring ────────────────────────────────────────────────
  function wireButtons() {
    document.getElementById('saveBtn').addEventListener('click', saveEntry);
    document.getElementById('editBtn').addEventListener('click', () => { isEditMode = true; renderPage(); });
    document.getElementById('cancelBtn').addEventListener('click', () => { isEditMode = false; renderPage(); });
    document.getElementById('loadMoreBtn').addEventListener('click', () => { pastOffset += BATCH; renderPast(); });
    document.getElementById('lightbox').addEventListener('click', () =>
      document.getElementById('lightbox').classList.remove('show'));
    document.addEventListener('click', e => {
      const img = e.target.closest('[data-lightbox]');
      if (img) { openLightbox(img.dataset.lightbox); }
    });
  }

  // ── Save ─────────────────────────────────────────────────────────
  async function saveEntry() {
    const wins = document.getElementById('fWins').value.trim();
    const losses = document.getElementById('fLosses').value.trim();
    const tomorrow = document.getElementById('fTomorrow').value.trim();
    const existing = getEntry(TODAY);
    const entry = {
      date: TODAY,
      wins, losses, tomorrow,
      rating: selectedRating,
      photos: photos.slice(),
      created_at: (existing && existing.created_at) || new Date().toISOString(),
      updated_at: new Date().toISOString(),
    };

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    const ok = await sbUpsert(entry);
    if (!ok) {
      btn.disabled = false;
      btn.textContent = 'Save entry';
      showToast('Save failed — check connection', true);
      return;
    }

    putEntry(entry);
    isEditMode = false;
    showToast('Saved');
    renderPage();
  }

  // ── Main render ──────────────────────────────────────────────────
  function renderPage() {
    const entry = getEntry(TODAY);
    if (entry && !isEditMode) {
      showReadMode(entry);
    } else {
      showFormMode(entry);
    }
    renderPast();
    renderTrend();
  }

  function showReadMode(entry) {
    document.getElementById('readCard').style.display = '';
    document.getElementById('formCard').style.display = 'none';

    const rc = ratingClass(entry.rating);
    const badge = document.getElementById('readBadge');
    badge.textContent = entry.rating || '—';
    badge.className = 'rating-badge' + (rc !== 'none' ? ' ' + rc : '');
    document.getElementById('readDateLabel').textContent = fmtDisplay(TODAY);

    setText('readWins',    entry.wins,    'Nothing logged.');
    setText('readLosses',  entry.losses,  'Nothing logged.');
    setText('readTomorrow',entry.tomorrow,'Nothing set.');

    const photosField = document.getElementById('readPhotosField');
    const photosWrap  = document.getElementById('readPhotos');
    if (entry.photos && entry.photos.length) {
      photosField.style.display = '';
      photosWrap.innerHTML = entry.photos.map((p, i) =>
        '<img src="' + p + '" alt="Photo ' + (i + 1) + '" data-lightbox="' + esc(p) + '">'
      ).join('');
    } else {
      photosField.style.display = 'none';
    }
  }

  function setText(id, val, fallback) {
    const el = document.getElementById(id);
    if (val) {
      el.textContent = val;
      el.className = 'entry-read-value';
    } else {
      el.textContent = fallback;
      el.className = 'entry-read-value empty';
    }
  }

  function showFormMode(existing) {
    document.getElementById('readCard').style.display = 'none';
    document.getElementById('formCard').style.display = '';
    const hasExisting = !!(existing && isEditMode);
    document.getElementById('cancelBtn').style.display = hasExisting ? '' : 'none';

    if (hasExisting) {
      document.getElementById('fWins').value    = existing.wins    || '';
      document.getElementById('fLosses').value  = existing.losses  || '';
      document.getElementById('fTomorrow').value = existing.tomorrow || '';
      photos = (existing.photos || []).slice();
      if (existing.rating) setRating(existing.rating); else clearRating();
    } else {
      document.getElementById('fWins').value    = '';
      document.getElementById('fLosses').value  = '';
      document.getElementById('fTomorrow').value = '';
      photos = [];
      clearRating();
    }
    renderPhotoSlots();
  }

  // ── Past entries ─────────────────────────────────────────────────
  function renderPast() {
    const all = getAll();
    const dates = Object.keys(all).filter(d => d !== TODAY).sort((a, b) => b.localeCompare(a));
    const container = document.getElementById('pastList');
    const loadBtn = document.getElementById('loadMoreBtn');
    const showing = dates.slice(0, pastOffset);

    if (!showing.length) {
      container.innerHTML = '<p style="text-align:center;font-size:13px;color:var(--text-4);padding:16px 0;font-style:italic">No past entries yet.</p>';
      loadBtn.style.display = 'none';
      return;
    }

    container.innerHTML = '';
    showing.forEach(date => {
      const e = all[date];
      const rc = ratingClass(e.rating);
      const preview = (e.wins || '').split('\n')[0].trim();
      const div = document.createElement('div');
      div.className = 'entry-card';
      div.innerHTML =
        '<div class="entry-card-header">' +
          '<span class="rating-dot ' + rc + '"></span>' +
          '<span class="entry-card-date">' + esc(fmtDisplay(date)) + '</span>' +
          '<span class="entry-card-preview">' + (preview ? esc(preview) : '<em style="color:var(--text-4)">No wins logged</em>') + '</span>' +
          '<span class="entry-card-chevron"><i data-lucide="chevron-down"></i></span>' +
        '</div>' +
        '<div class="entry-card-body">' +
          readField('W — Wins', e.wins) +
          readField('L — Losses', e.losses) +
          readField('→ Tomorrow\'s Focus', e.tomorrow) +
          (e.rating ? '<div class="entry-read-field"><div class="entry-read-label">Rating</div>' +
            '<div class="entry-read-value"><span class="rating-badge ' + rc + '" style="display:inline-flex;width:28px;height:28px;font-size:12px">' + e.rating + '</span></div></div>' : '') +
          (e.photos && e.photos.length ?
            '<div class="entry-read-field"><div class="entry-read-label">Photos</div><div class="entry-photos">' +
            e.photos.map((p, i) => '<img src="' + p + '" alt="Photo ' + (i+1) + '" data-lightbox="' + esc(p) + '">').join('') +
            '</div></div>' : '') +
        '</div>';
      div.querySelector('.entry-card-header').addEventListener('click', () => div.classList.toggle('expanded'));
      container.appendChild(div);
    });

    if (window.lucide) window.lucide.createIcons({ nodes: [container] });
    loadBtn.style.display = dates.length > pastOffset ? '' : 'none';
  }

  function readField(label, val) {
    const empty = !val;
    return '<div class="entry-read-field">' +
      '<div class="entry-read-label">' + label + '</div>' +
      '<div class="entry-read-value' + (empty ? ' empty' : '') + '">' +
        (empty ? 'Nothing logged.' : esc(val)) +
      '</div></div>';
  }

  // ── Trend graph ──────────────────────────────────────────────────
  function renderTrend() {
    const all = getAll();
    const DAYS = 30;
    const W = 320, H = 90;
    const pL = 22, pR = 6, pT = 8, pB = 8;
    const iW = W - pL - pR, iH = H - pT - pB;

    const dates = [];
    for (let i = DAYS - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      dates.push(d.toLocaleDateString('en-CA', { timeZone: 'America/Vancouver' }));
    }

    const pts = dates.map((d, i) => {
      const e = all[d];
      const r = e && e.rating ? e.rating : null;
      const x = pL + (i / (DAYS - 1)) * iW;
      const y = r !== null ? pT + (1 - (r - 1) / 9) * iH : null;
      return { x, y, r, date: d };
    });

    let html = '';

    // Y grid + labels
    [1, 4, 7, 10].forEach(v => {
      const y = pT + (1 - (v - 1) / 9) * iH;
      html += `<line x1="${pL}" x2="${W - pR}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
      html += `<text x="${(pL - 3).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" font-size="7.5" fill="rgba(255,255,255,0.25)" text-anchor="end" font-family="ui-monospace,monospace">${v}</text>`;
    });

    // Connect line segments
    let seg = '';
    pts.forEach(p => {
      if (p.y !== null) seg += (seg ? ' L ' : 'M ') + p.x.toFixed(1) + ',' + p.y.toFixed(1);
      else if (seg) { html += `<path d="${seg}" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>`; seg = ''; }
    });
    if (seg) html += `<path d="${seg}" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none" stroke-linejoin="round"/>`;

    // Dots
    pts.forEach(p => {
      if (p.y === null) return;
      const color = { red: '#ff8a8a', yellow: '#fbbf24', green: '#6ee7b7' }[ratingClass(p.r)] || '#6ee7b7';
      html += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="${color}" stroke="var(--bg)" stroke-width="1.5" data-trend-date="${p.date}" style="cursor:pointer"/>`;
    });

    document.getElementById('trendSvg').innerHTML = html;

    const first = dates[0].slice(5).replace('-', '/');
    const last  = dates[dates.length - 1].slice(5).replace('-', '/');
    document.getElementById('trendLabels').innerHTML =
      '<span>' + first + '</span><span>' + last + '</span>';

    // Dot tap → jump to entry
    document.getElementById('trendSvg').querySelectorAll('[data-trend-date]').forEach(el => {
      el.addEventListener('click', () => jumpToEntry(el.dataset.trendDate));
    });
  }

  function jumpToEntry(date) {
    if (date === TODAY) {
      document.getElementById('readCard').scrollIntoView({ behavior: 'smooth' });
      return;
    }
    const all = getAll();
    const dates = Object.keys(all).filter(d => d !== TODAY).sort((a, b) => b.localeCompare(a));
    const idx = dates.indexOf(date);
    if (idx < 0) return;
    if (idx >= pastOffset) { pastOffset = idx + 1; renderPast(); }
    setTimeout(() => {
      const cards = document.querySelectorAll('.entry-card');
      if (cards[idx]) {
        cards[idx].classList.add('expanded');
        cards[idx].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }, 60);
  }

  // ── Lightbox ─────────────────────────────────────────────────────
  function openLightbox(src) {
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('show');
  }

  // ── Toast ─────────────────────────────────────────────────────────
  function showToast(msg, isError) {
    const t = document.getElementById('saveToast');
    t.textContent = msg;
    if (isError) {
      t.style.background = 'rgba(255,138,138,0.12)';
      t.style.borderColor = 'rgba(255,138,138,0.3)';
      t.style.color = 'var(--bad)';
    } else {
      t.style.background = '';
      t.style.borderColor = '';
      t.style.color = '';
    }
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2400);
  }

  // ── Loading state ────────────────────────────────────────────────
  function showLoading() {
    document.getElementById('journalLoading').style.display = '';
    document.getElementById('readCard').style.display = 'none';
    document.getElementById('formCard').style.display = 'none';
  }
  function hideLoading() {
    document.getElementById('journalLoading').style.display = 'none';
  }

  // ── Init: fetch Supabase first, render only after ─────────────────
  async function init() {
    showLoading();
    let rows = null;
    try {
      rows = await Promise.race([
        sbFetchAll(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 3000)),
      ]);
    } catch {
      rows = null; // timed out — fall back to localStorage
    }
    if (rows !== null && rows.length > 0) {
      const all = {};
      rows.forEach(row => {
        all[row.date] = {
          date:       row.date,
          wins:       row.wins      || '',
          losses:     row.losses    || '',
          tomorrow:   row.tomorrow  || '',
          rating:     row.rating    || null,
          photos:     row.photos    || [],
          created_at: row.created_at,
          updated_at: row.updated_at,
        };
      });
      setAll(all);
    }
    hideLoading();
    renderPage();
  }

})();
</script>
